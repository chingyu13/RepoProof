<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoProof — Assessment</title>
<style>
/* Theme tokens from Figma: File Uploader — Light & Dark Mode (Community) */
:root{
  --bg:#f1f4ff; --card:#ffffff; --ink:#0c1421; --muted:#7d7d7d;
  --line:#d8daeb; --input-bg:#fefefe; --placeholder:#949fb1; --chip:#e7e9f5;
  --accent:#5046fa; --accent-hover:#4238e0; --ok:#06bf5c; --bad:#e33434;
  --code-bg:#0f1420; --code-ink:#e6e9f0;
  --shadow:0 12px 32px rgba(12,20,33,.07);
}
[data-theme="dark"]{
  --bg:#161618; --card:#1e1f22; --ink:#f5f6f8; --muted:#9a9aa3;
  --line:#33343a; --input-bg:#232428; --placeholder:#6f7078; --chip:#3a3b40;
  --accent:#5046fa; --accent-hover:#6157ff; --ok:#06bf5c; --bad:#f2555a;
  --code-bg:#0b0e16; --code-ink:#e6e9f0;
  --shadow:0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
main{max-width:760px;margin:2rem auto;padding:0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.3rem 1.5rem;margin-bottom:1rem;box-shadow:var(--shadow)}
h1{font-size:1.3rem;font-weight:600}
.q{margin:1.4rem 0;padding-top:1rem;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:.2rem}
.stem{margin:.2rem 0 .7rem}
.opt{display:block;margin:.4rem 0;border-radius:10px;border:1px solid var(--line);overflow:hidden;transition:background .12s,border-color .12s}
.opt-row{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .7rem;cursor:pointer}
.opt-row:hover{background:var(--bg)}
.opt .mark{margin-left:auto;font-weight:800;font-size:1rem}
.opt.correct-opt{border-color:var(--ok);background:rgba(6,191,92,.09)}
.opt.wrong-opt{border-color:var(--bad);background:rgba(227,52,52,.09)}
.opt-exp{display:none;color:var(--muted);font-size:.8rem;line-height:1.55;padding:0 .8rem .55rem 2rem}
.small{font-size:.82rem;color:var(--muted)}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:.65rem 1.2rem;font:inherit;font-weight:500;letter-spacing:.03em;cursor:pointer}
button:hover{background:var(--accent-hover)}
button:disabled{opacity:.5;cursor:default}
button.check-btn{background:var(--input-bg);color:var(--ink);border:1.5px solid var(--accent);padding:.45rem 1rem;margin-top:.4rem}
button.check-btn:hover{background:var(--bg)}
#themeToggle{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:5px;float:right;display:flex;gap:8px;padding:5px}
#themeToggle .seg{width:24px;height:24px;border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:transparent}
#themeToggle .seg.active{background:var(--chip);color:var(--ink)}
#themeToggle .theme-icon{width:20px;height:20px;display:block}
#themeToggle .theme-icon *{stroke:currentColor}
/* code blocks & inline code embedded in stems / explanations */
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:.8rem 1rem;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem;line-height:1.5;margin:.55rem 0;
  white-space:pre;tab-size:4}
code.inline{background:var(--chip);border-radius:6px;padding:.06rem .38rem;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
/* Python-ish syntax highlight tokens (readable on the dark code panel) */
.tok-kw{color:#569cd6} .tok-fn{color:#dcdcaa} .tok-str{color:#ce9178}
.tok-com{color:#6a9955;font-style:italic} .tok-num{color:#b5cea8} .tok-bi{color:#4ec9b0} .tok-dec{color:#4ec9b0}
.answer-line{font-size:.8rem;color:var(--muted);margin:.5rem 0 .2rem;font-weight:500}
.err{color:var(--bad)}
.profile-row{display:flex;align-items:center;gap:.6rem;margin:.25rem 0}
</style>
</head>
<body>
<main>
  <div class="card" id="intro">
    <button id="themeToggle" title="Toggle light/dark" aria-label="Toggle light/dark">
      <span class="seg" id="segSun">
        <svg class="theme-icon" viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <circle cx="13" cy="13" r="5.2" stroke-width="1.4"/>
          <path d="M13 3.4v3M13 19.6v3M3.4 13h3M19.6 13h3M6.2 6.2l2.1 2.1M17.7 17.7l2.1 2.1M19.8 6.2l-2.1 2.1M8.3 17.7l-2.1 2.1" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="seg" id="segMoon">
        <svg class="theme-icon" viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <path d="M17.9 17.2a7.6 7.6 0 0 1-8.8-8.8 7.7 7.7 0 1 0 8.8 8.8Z" stroke-width="1.4" stroke-linejoin="round"/>
          <circle cx="17.7" cy="8" r=".9" fill="currentColor" stroke="none"/>
          <circle cx="20.2" cy="11.2" r=".65" fill="currentColor" stroke="none"/>
        </svg>
      </span>
    </button>
    <h1 id="title">Loading…</h1>
    <p class="small" id="scoring"></p>
    <p class="small" id="ridNote" style="display:none"></p>
  </div>
  <div class="card" id="paper"></div>
  <div class="card"><button id="submit">Finish &amp; get completion code</button> <span class="err" id="err"></span></div>
  <div class="card" id="report" style="display:none"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const token = location.pathname.split('/').pop();
// Personalised link: /a/<token>?rid=<RepoID>. The RepoID is a pseudonymous code;
// the student's SID is never part of the link and never sent to RepoProof.
const repoId = (new URLSearchParams(location.search).get('rid') || '').trim();
let data = null;
const checked = {};   // qid -> selected options (from immediate-feedback checks)

if (repoId) {
  const note = $('ridNote');
  note.style.display = 'block';
  note.innerHTML = 'You are taking this as <strong>' + repoId.replace(/[^A-Za-z0-9_-]/g,'') +
    '</strong>. RepoProof identifies you only by this code — your student ID is never sent.';
}

const savedTheme = localStorage.getItem('rp-theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
function syncThemeBtn(){
  const dark = document.documentElement.dataset.theme === 'dark';
  $('segSun').classList.toggle('active', !dark);
  $('segMoon').classList.toggle('active', dark);
}
$('themeToggle').onclick = ()=>{
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('rp-theme', next);
  syncThemeBtn();
};
syncThemeBtn();

async function api(path, opts={}) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(()=>({detail:r.statusText}));
  if (!r.ok) throw new Error(body.detail || JSON.stringify(body));
  return body;
}
function esc(s){ return (s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Render stems/explanations that may contain fenced code (```lang\n...```) and
// inline `code`. Fenced blocks become styled, syntax-highlighted <pre> panels.
function renderRich(txt){
  const s = txt || '';
  const re = /```([a-zA-Z0-9_+.#-]*)\n?([\s\S]*?)```/g;
  let out = '', last = 0, m;
  while ((m = re.exec(s))){
    out += inlineBits(s.slice(last, m.index));
    out += '<pre class="code"><code>' + highlight(m[1].toLowerCase(), m[2].replace(/\n$/,'')) + '</code></pre>';
    last = re.lastIndex;
  }
  out += inlineBits(s.slice(last));
  return out;
}
function inlineBits(chunk){
  return '<span style="white-space:pre-wrap">' +
    esc(chunk).replace(/`([^`\n]+)`/g, (_,c)=>'</span><code class="inline">'+c+'</code><span style="white-space:pre-wrap">') +
    '</span>';
}

// Lightweight, dependency-free syntax highlighter. Python (and unlabelled code,
// since notebooks are Python) gets keyword/function/string/comment colouring.
const PY_KW = new Set(['def','return','if','elif','else','for','while','in','not','and','or','import',
  'from','as','class','with','try','except','finally','raise','lambda','yield','pass','break','continue',
  'global','nonlocal','assert','del','is','None','True','False','async','await','match','case']);
const PY_BI = new Set(['print','len','range','int','str','float','list','dict','set','tuple','bool','open',
  'enumerate','zip','map','filter','sum','min','max','sorted','abs','type','isinstance','super','pd','np','self','cls']);
function highlight(lang, code){
  if (lang && !['python','py','ipynb','','text'].includes(lang)) return esc(code);
  const re = /(#[^\n]*)|('''[\s\S]*?'''|"""[\s\S]*?"""|'(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*")|(\b\d+\.?\d*\b)|(@[A-Za-z_]\w*)|([A-Za-z_]\w*)|([\s\S])/g;
  let out = '', m, defNext = false;
  while ((m = re.exec(code))){
    if (m[1]) out += `<span class="tok-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tok-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tok-num">${esc(m[3])}</span>`;
    else if (m[4]) out += `<span class="tok-dec">${esc(m[4])}</span>`;
    else if (m[5]){
      const w = m[5];
      if (PY_KW.has(w)) { out += `<span class="tok-kw">${esc(w)}</span>`; defNext = (w==='def'||w==='class'); }
      else if (defNext) { out += `<span class="tok-fn">${esc(w)}</span>`; defNext = false; }
      else if (/^\s*\(/.test(code.slice(re.lastIndex))) out += `<span class="tok-fn">${esc(w)}</span>`;
      else if (PY_BI.has(w)) out += `<span class="tok-bi">${esc(w)}</span>`;
      else out += esc(w);
    }
    else { out += esc(m[6]); if (!/\s/.test(m[6])) defNext = false; }
  }
  return out;
}

let adaptive = false;
const accResponses = {};
const accOrder = [];

function renderQuestionBlock(q, label){
  const d = document.createElement('div');
  d.className = 'q';
  d.dataset.qid = q.id;
  const single = !!q.single;
  const hint = single
    ? ' <span class="small">(select one)</span>'
    : (q.correct_count ? ` <span class="small">(${q.correct_count} correct)</span>` : '');
  const inputType = single ? 'radio' : 'checkbox';
  const nameAttr = single ? ` name="q-${q.id}"` : '';
  const opts = q.options.map(o =>
    `<div class="opt" data-key="${o.key}">
       <label class="opt-row"><input type="${inputType}"${nameAttr} data-q="${q.id}" value="${o.key}">
         <span><strong>${o.key}.</strong> ${esc(o.text)}</span><span class="mark"></span></label>
       <div class="opt-exp"></div>
     </div>`
  ).join('');
  d.innerHTML =
    `<div class="stem"><strong>${label}.</strong> ${renderRich(q.stem)}${hint}</div>
     ${opts}
     ${single ? '' : '<button class="check-btn" type="button">Check answer</button>'}`;
  if (single){
    // Single-answer: selecting an option reveals feedback immediately, no button.
    d.querySelectorAll('input[type=radio]').forEach(r =>
      r.addEventListener('change', ()=>checkQuestion(q, d, null)));
  } else {
    const btn = d.querySelector('.check-btn');
    btn.onclick = ()=>checkQuestion(q, d, btn);
  }
  return d;
}

async function checkQuestion(q, block, btn){
  if (block.dataset.done) return;   // answer once
  const selected = [...block.querySelectorAll('input:checked')].map(c=>c.value);
  if (!selected.length){ $('err').textContent = 'Select an option first.'; return; }
  block.dataset.done = '1';
  $('err').textContent = '';
  let res;
  try {
    res = await api('/api/take/'+token+'/check', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question_id: q.id, selected})});
  } catch(e){ $('err').textContent = e.message; return; }
  checked[q.id] = selected;
  const ans = res.answer, exps = res.explanations || {};
  block.querySelectorAll('.opt').forEach(box=>{
    const key = box.dataset.key;
    const inp = box.querySelector('input');
    inp.disabled = true;
    const isAns = ans.includes(key), isSel = selected.includes(key);
    const mark = box.querySelector('.mark');
    if (isAns){ box.classList.add('correct-opt'); mark.textContent = '✓'; mark.style.color = 'var(--ok)'; }
    else if (isSel){ box.classList.add('wrong-opt'); mark.textContent = '✗'; mark.style.color = 'var(--bad)'; }
    // Explain only the options that matter: correct answer(s) + what the student chose.
    if (isAns || isSel){
      const text = exps[key] || res.explanation || '';
      if (text){
        const e = box.querySelector('.opt-exp');
        e.innerHTML = renderRich(text);
        e.style.display = 'block';
      }
    }
  });
  if (btn) btn.disabled = true;
}

async function load(){
  try { data = await api('/api/take/'+token); }
  catch(e){ $('title').textContent = 'Not found'; $('err').textContent = e.message; return; }
  $('title').textContent = data.title;
  $('scoring').textContent = data.scoring + ' You get immediate feedback after each question.';
  adaptive = !!data.adaptive;
  if (adaptive){
    $('scoring').textContent += ' Question order adapts to your answers.';
    $('submit').parentElement.style.display = 'none';
    await nextAdaptive();
    return;
  }
  const paper = $('paper');
  data.questions.forEach((q,i)=> paper.appendChild(renderQuestionBlock(q, 'Q'+(i+1))));
}

async function nextAdaptive(){
  const r = await api('/api/take/'+token+'/next', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({responses: accResponses, order: accOrder})});
  const paper = $('paper');
  paper.innerHTML = '';
  if (r.done){
    paper.innerHTML = '<p class="small">All questions answered — submitting…</p>';
    await doSubmit(accResponses);
    return;
  }
  const q = r.question;
  const block = renderQuestionBlock(q, `Question ${r.answered+1} / ${r.total}`);
  paper.appendChild(block);
  const btn = document.createElement('button');
  btn.textContent = (r.answered + 1 === r.total) ? 'Finish' : 'Next question';
  btn.onclick = async ()=>{
    accResponses[q.id] = [...block.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value);
    accOrder.push(q.id);
    btn.disabled = true;
    try { await nextAdaptive(); }
    catch(e){ $('err').textContent = e.message; btn.disabled = false; }
  };
  paper.appendChild(btn);
}

async function doSubmit(responses){
  try {
    const score = await api('/api/take/'+token+'/submit', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({repo_id: repoId, responses})});
    showReport(score);
  } catch(e){ $('err').textContent = e.message; }
}

$('submit').onclick = async ()=>{
  $('err').textContent = '';
  // Gate: every question must be answered before finishing.
  const unanswered = data.questions.filter(q => !(checked[q.id] && checked[q.id].length));
  if (unanswered.length){
    $('err').textContent = `Please answer all questions first — ${unanswered.length} still to go.`;
    const first = document.querySelector('.q[data-qid="'+unanswered[0].id+'"]');
    if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  const responses = {};
  data.questions.forEach(q=>{ responses[q.id] = checked[q.id] || []; });
  document.querySelectorAll('#paper input:checked').forEach(c=>{
    const arr = responses[c.dataset.q] || (responses[c.dataset.q] = []);
    if (!arr.includes(c.value)) arr.push(c.value);
  });
  $('submit').disabled = true;
  await doSubmit(responses);
};

function showReport(s){
  const r = $('report');
  r.style.display = 'block';
  let html = `<h1>Result: ${s.correct}/${s.total} (${s.percent}%)</h1>`;
  if (s.completion_code) {
    html += `<div class="card" style="border:2px solid var(--ok)">
      <p style="margin:.2rem 0"><strong>Completion code</strong> — paste this into the Canvas quiz for your 2% participation:</p>
      <p style="font-size:1.4rem;font-weight:800;letter-spacing:.05em;margin:.2rem 0">${esc(s.completion_code)}</p>
      <p class="small" style="margin:.2rem 0">Correctness does not affect your mark — this is a learning check.</p></div>`;
  }
  html += '<h3>Understanding profile</h3>' + Object.entries(s.per_focus).map(([k,v])=>{
    const pct = v.total ? Math.round(100*v.correct/v.total) : 0;
    return `<div class="profile-row">
      <span style="flex:0 0 9em">${esc(k)}</span>
      <span style="flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden">
        <span style="display:block;height:100%;width:${pct}%;background:${pct>=60?'var(--ok)':pct>=40?'#d9a514':'var(--bad)'}"></span>
      </span>
      <span class="small" style="flex:0 0 6em">${pct}% (${v.correct}/${v.total})</span>
    </div>`;
  }).join('');
  r.innerHTML = html;
  r.scrollIntoView({behavior:'smooth'});
}

load();
</script>
</body>
</html>
